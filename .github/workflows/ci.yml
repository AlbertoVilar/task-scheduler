name: Java CI com Maven (Daily)

on:
  # Dispara em push nas branches de trabalho e PRs somente contra develop
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
  # Permite execução manual pelo Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configura o JDK 21 e o cache do Maven
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Habilita o cache do Maven para builds mais rápidos
          cache: maven

      # 3. Executa o build (compila, testa e empacota)
      # O 'install' garante que todos os módulos (se houver) sejam construídos
      - name: Executar Build e Testes com Maven
        run: mvn clean install -DskipTests=false

      # 4. Publicar o arquivo .jar gerado como artefato
      # Isso permite que você baixe o build final do GitHub
      - name: Publicar Artefato do Build
        uses: actions/upload-artifact@v4
        with:
          name: daily-agendador-jar
          # O Maven coloca o JAR executável na pasta 'target'
          path: target/*.jar
